services:
  db:
    # Postgres 16 with pgvector, for image and text embeddings.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photoalbum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photoalbum}
      POSTGRES_DB: ${POSTGRES_DB:-photoalbum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photoalbum} -d ${POSTGRES_DB:-photoalbum}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: photoalbum:local
    build:
      context: .
      args:
        # Baked into the client bundle at build time; rebuild after changing them in .env.
        NEXT_PUBLIC_TILE_URL: ${NEXT_PUBLIC_TILE_URL:-}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MAP_GLYPHS_URL: ${NEXT_PUBLIC_MAP_GLYPHS_URL:-}
    restart: unless-stopped
    # Give in-flight photo processing time to finish before Docker kills the container.
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-photoalbum}:${POSTGRES_PASSWORD:-photoalbum}@db:5432/${POSTGRES_DB:-photoalbum}
      PHOTO_STORAGE_ROOT: /data/photos
    volumes:
      - photos:/data/photos
      - imports:/data/imports
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - default
      - internal

  # Optional: run background jobs in their own container.
  # Set RUN_WORKER=false in .env and start with `docker compose --profile worker up -d`.
  worker:
    image: photoalbum:local
    profiles: ["worker"]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-photoalbum}:${POSTGRES_PASSWORD:-photoalbum}@db:5432/${POSTGRES_DB:-photoalbum}
      PHOTO_STORAGE_ROOT: /data/photos
      RUN_WORKER: "true"
    volumes:
      - photos:/data/photos
      - imports:/data/imports
    networks:
      - default
      - internal
    command: ["./node_modules/.bin/tsx", "scripts/worker.ts"]

  # Local ML sidecar (faces, image and text embeddings). Optional: set ML_URL=http://ml:8000 and ML_TOKEN in .env,
  # run `docker compose run --rm ml-init` once to fetch weights, then `docker compose --profile ml up -d`.
  # No host ports, internal network only, nothing written to disk or logs. Needs about 2 GB of RAM to itself.
  ml:
    build: ./ml
    image: photoalbum-ml:local
    profiles: ["ml"]
    restart: unless-stopped
    environment:
      ML_TOKEN: ${ML_TOKEN:-}
      ML_IDLE_UNLOAD_SECONDS: ${ML_IDLE_UNLOAD_SECONDS:-300}
      ML_MODEL_DIR: /models
    volumes:
      - ml-models:/models
    networks:
      - internal
    mem_limit: 2500m

  # One-time weight download on the default network (the ml service itself has no outbound access).
  ml-init:
    image: photoalbum-ml:local
    build: ./ml
    profiles: ["ml-init"]
    environment:
      ML_MODEL_DIR: /models
    volumes:
      - ml-models:/models
    command: ["python", "-m", "ml.download"]

networks:
  default:
  internal:
    internal: true

volumes:
  pgdata:
  photos:
  # Google Takeout archives are copied here (docker compose cp takeout-001.zip app:/data/imports/) and imported from the Admin page.
  imports:
  ml-models:
