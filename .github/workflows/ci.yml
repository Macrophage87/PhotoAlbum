name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: photoalbum
          POSTGRES_PASSWORD: photoalbum
          POSTGRES_DB: photoalbum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U photoalbum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://photoalbum:photoalbum@localhost:5432/photoalbum
      APP_URL: http://localhost:3200
      ADMIN_EMAIL: admin@example.com
      PHOTO_STORAGE_ROOT: /tmp/photoalbum-photos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE photoalbum_test' -c 'CREATE DATABASE photoalbum_e2e'
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://photoalbum:photoalbum@localhost:5432/photoalbum_test
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
