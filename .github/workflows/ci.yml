name: CI

on:
  # Branches are tested through their pull request; testing the push as well ran everything twice.
  push:
    branches: [main, staging]
  pull_request:
  # Run by hand on staging or main to redeploy its tip once it passes again.
  workflow_dispatch:

# Read the code, nothing more; the deploy workflows it calls ask for less still.
permissions:
  contents: read

# A newer push to the same pull request or branch makes the older run pointless.
# On main and staging every commit runs to the end, since each one deploys.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.run_id || 'latest' }}
  cancel-in-progress: true

# The work is split into jobs that run side by side; together they run exactly what the single job used to.
# The longest is e2e (one serial Playwright file, so it cannot be split); the unit tests run in three shards,
# each against its own Postgres, while it goes.
jobs:
  checks:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photoalbum
          POSTGRES_PASSWORD: photoalbum
          POSTGRES_DB: photoalbum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U photoalbum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://photoalbum:photoalbum@localhost:5432/photoalbum
      APP_URL: http://localhost:3200
      ADMIN_EMAIL: admin@example.com
      PHOTO_STORAGE_ROOT: /tmp/photoalbum-photos
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
        with:
          ffmpeg: "true"
      # Vitest's global setup migrates photoalbum_test, creating it if missing.
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  ml:
    name: ML sidecar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sidecar's own Python (ml/Dockerfile): the runner's default moved to 3.14, which the pinned Pillow
      # has no wheel for, so pip tried to build it from source and failed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: ML sidecar tests (stub mode, no weights)
        run: |
          pip install -r ml/requirements.txt
          cd ml && python -m pytest -q

  e2e:
    name: build and e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photoalbum
          POSTGRES_PASSWORD: photoalbum
          POSTGRES_DB: photoalbum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U photoalbum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://photoalbum:photoalbum@localhost:5432/photoalbum
      APP_URL: http://localhost:3200
      ADMIN_EMAIL: admin@example.com
      PHOTO_STORAGE_ROOT: /tmp/photoalbum-photos
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
        with:
          ffmpeg: "true"
      - name: Create the e2e database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE photoalbum_e2e'
      # Next's own build cache; a stale one only makes the build slower, never different.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

  # The one check that stands for all of the above, under the name the single job had, so a required "test"
  # check still means everything passed.
  test:
    needs: [checks, unit, ml, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ML sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./ml
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml

  # Deploys wait for both jobs above, so a commit that fails lint, tests, e2e or
  # the image build never reaches the server; they deploy github.sha, the
  # commit those jobs checked out. Pull requests never deploy.
  deploy-staging:
    needs: [test, docker]
    if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  deploy-production:
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
