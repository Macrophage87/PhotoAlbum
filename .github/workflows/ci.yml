name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Run by hand on staging or main to redeploy its tip once it passes again.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: photoalbum
          POSTGRES_PASSWORD: photoalbum
          POSTGRES_DB: photoalbum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U photoalbum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://photoalbum:photoalbum@localhost:5432/photoalbum
      APP_URL: http://localhost:3200
      ADMIN_EMAIL: admin@example.com
      PHOTO_STORAGE_ROOT: /tmp/photoalbum-photos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ffmpeg (clip transcoding in unit and e2e tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Create test databases
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE photoalbum_test' -c 'CREATE DATABASE photoalbum_e2e'
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://photoalbum:photoalbum@localhost:5432/photoalbum_test
      - run: pnpm test
      - name: ML sidecar tests (stub mode, no weights)
        run: |
          pip install -r ml/requirements.txt
          cd ml && python -m pytest -q
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ML sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./ml
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml

  # Deploys wait for both jobs above, so a commit that fails lint, tests, e2e or
  # the image build never reaches the server; they deploy github.sha, the
  # commit those jobs checked out. Pull requests never deploy.
  deploy-staging:
    needs: [test, docker]
    if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  deploy-production:
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
